<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPANKY'S</title>
<meta name="theme-color" content="#2A0047">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPANKY'S">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Marca SPANKY'S: morado como color principal (navegación y encabezados), amarillo y naranja para acciones y precios,
   crema como fondo, fucsia y verde para estados. Layout: barra de navegación morada + área de trabajo; en Venta, catálogo a la izquierda y comanda a la derecha. */
:root{
  --bg:#FFF7EC; --panel:#FFFFFF; --paper:#FFFFFF; --soft:#F4ECFA; --line:#EADFF2;
  --ink:#2A0047; --mute:#6B6B6B; --on-ink:#FFFFFF;
  --ok:#00936A; --warn:#C25E00; --bad:#D9302A;
  --brand:#6D00A1; --brand-dark:#2A0047; --brand-light:#9B4DFF; --lila:#C9A6FF;
  --yellow:#FFC629; --yellow-soft:#FFE8B8; --orange:#FF7A00; --orange-text:#D35F00;
  --fucsia:#E91E8F; --green:#00C48C; --red:#FF3B30;
  --f-ui:"Poppins", "Helvetica Neue", Arial, sans-serif;
  --f-brand:"Pacifico", "Brush Script MT", cursive;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --rail:80px; --tk:360px;
  color-scheme:light;
}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-ui);-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}

.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100%}
.rail{display:flex;flex-direction:column;gap:2px;padding:12px 6px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:grid;place-items:center;margin:2px auto 14px;width:44px;height:44px;border:1.5px solid var(--ink);border-radius:50%;font:700 15px var(--f-mono);letter-spacing:-.02em}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 9px;border:0;background:none;border-radius:10px;color:var(--mute);font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.nav svg{width:24px;height:24px}
.nav[aria-current="page"]{color:var(--ink);background:var(--soft)}
.nav .badge{position:absolute;top:5px;right:10px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:var(--paper);font:600 10px/17px var(--f-mono);letter-spacing:0}
.rail .spacer{flex:1}
.clock{font:500 11px var(--f-mono);color:var(--mute);text-align:center;padding:6px 0}

main{min-width:0;height:100%;overflow:hidden;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.vhead h1{font-size:21px;font-weight:800;letter-spacing:-.015em;margin-right:auto}
.vhead h1 small{display:block;font:500 11.5px var(--f-mono);color:var(--mute);letter-spacing:0;margin-top:2px}
.vbody{flex:1;min-height:0;overflow:auto;padding:16px 20px 32px}

.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--panel);gap:2px}
.seg button{border:0;background:none;padding:0 13px;border-radius:7px;font-weight:600;font-size:13px;color:var(--mute);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg.sm button{min-height:32px;padding:0 10px;font-size:12px}
.primary{background:var(--ink);color:var(--on-ink);border:1px solid var(--ink);border-radius:9px;min-height:46px;font-weight:700;font-size:15px;padding:0 18px}
.primary:disabled{opacity:.4}
.ghost{background:transparent;border:1px solid var(--line);border-radius:9px;min-height:42px;padding:0 14px;font-weight:600}
.ghost.sm,.primary.sm{min-height:36px;font-size:13px;padding:0 12px}
.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);border-radius:9px;min-height:42px;padding:0 14px;font-weight:700}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.inp{height:42px;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:0 11px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:72px;padding:9px 11px;resize:vertical}
.inp.num{font-family:var(--f-mono);text-align:right}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pill{display:inline-block;font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.banner{margin:12px 16px 0;padding:10px 12px;border:1px dashed var(--bad);color:var(--bad);border-radius:8px;font-size:13px}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:48px 16px;color:var(--mute)}
.empty .ico{width:44px;height:44px}
.empty b{color:var(--ink);font-size:15px}

/* ---------- Venta ---------- */
.venta{display:grid;grid-template-columns:minmax(0,1fr) var(--tk);flex:1;min-height:0}
.catalog{display:flex;flex-direction:column;min-height:0;min-width:0}
.cat-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.sizes{display:flex;align-items:center;gap:8px}
.sizes .seg button{display:grid;grid-template-columns:auto auto;align-items:baseline;gap:4px}
.sizes .seg b{font:700 15px var(--f-mono)}
.sizes .seg small{font:500 10.5px var(--f-mono);opacity:.75}
.grid{flex:1;overflow:auto;padding:14px 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;align-content:start}
.tile{position:relative;display:grid;grid-template-rows:auto auto 1fr;justify-items:start;gap:6px;padding:10px 10px 9px;min-height:102px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;transition:transform .08s,background .15s}
.tile:active{transform:scale(.96);background:var(--soft)}
.tile .ico{width:30px;height:30px}
.tile-name{font-weight:650;font-size:13px;line-height:1.2}
.tile-meta{align-self:end;width:100%;display:grid;gap:1px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.tile-meta i{font-style:normal;color:var(--mute);font-size:10px}
.tile.low .tile-meta i{color:var(--warn)}
.tile.out{opacity:.5}
.tile.out .tile-meta i{color:var(--bad)}
.tile .cnt{position:absolute;top:7px;right:7px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--on-ink);font:600 11px/22px var(--f-mono);text-align:center;padding:0 5px}
.tile.flash{animation:fl .35s}
@keyframes fl{0%{background:var(--soft)}100%{background:var(--panel)}}

.ticket{border-left:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;min-height:0}
.tk-top{padding:12px 14px 10px;display:grid;gap:10px;border-bottom:1px dashed var(--line)}
.tk-top .row{justify-content:space-between}
.tk-num{font:600 16px var(--f-mono);letter-spacing:.02em}
.tk-top select{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:0 8px;font-size:13px;max-width:150px}
.tk-lines{flex:1;overflow:auto;padding:4px 14px;min-height:120px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.qty{display:flex;align-items:center}
.qty button{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:7px;font:600 16px var(--f-mono);line-height:1}
.qty span{min-width:28px;text-align:center;font:600 14px var(--f-mono)}
.line-name{font-weight:650;font-size:13px;line-height:1.25;min-width:0}
.line-name small{display:block;font:400 11px var(--f-mono);color:var(--mute)}
.szchip{font:600 11px var(--f-mono);border:1px solid var(--ink);border-radius:4px;padding:1px 6px;margin-left:4px;background:none;vertical-align:1px}
.line-tot{font:500 13px var(--f-mono);text-align:right}
.tk-empty{display:grid;place-items:center;text-align:center;height:100%;min-height:140px;color:var(--mute);font-size:13px;gap:6px;padding:20px}
.tk-empty .ico{width:34px;height:34px;opacity:.6}
.tk-foot{border-top:1px dashed var(--line);padding:10px 14px 14px;display:grid;gap:10px}
.tk-client{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:end}
.cash{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{min-height:36px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:0 10px;font:600 12px var(--f-mono)}
.tot{font-family:var(--f-mono);font-variant-numeric:tabular-nums;display:grid;grid-template-columns:1fr auto;gap:1px 10px;margin:0;font-size:12.5px}
.tot dt{color:var(--mute)} .tot dd{margin:0;text-align:right}
.tot .big{font-size:24px;font-weight:600;color:var(--ink);padding-top:4px}
.tot .chg{font-weight:600;color:var(--ink)}
.tk-actions{display:grid;grid-template-columns:auto 1fr;gap:8px}
.tk-actions .primary{min-height:54px;font-size:16px}
.mbar{display:none}

/* ---------- tablas / listas ---------- */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.ing-name{font-weight:650}
.meter{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;width:100px}
.meter i{display:block;height:100%;background:var(--ink)}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.icell{display:flex;align-items:center;gap:10px}
.icell .ico{width:28px;height:28px;flex:none}

.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;flex:1;min-height:0}
.split>.list{overflow:auto;padding:8px 20px 28px;min-width:0}
.split>.detail{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:18px}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:16px 2px 6px;border-bottom:1px solid var(--line)}
.day b{font-weight:700}
.frow{display:grid;grid-template-columns:96px 52px minmax(0,1fr) auto 82px;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--soft);background:none;padding:11px 4px;font-size:13px}
.frow[aria-current="true"]{background:var(--soft)}
.frow .mono{font-size:12.5px}
.frow .cli{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow.anul .total{text-decoration:line-through;color:var(--mute)}

/* recibo térmico */
.receipt{position:relative;background:var(--paper);color:var(--ink);font:12.5px/1.5 var(--f-mono);font-variant-numeric:tabular-nums;padding:20px 18px 26px;max-width:340px;margin:0 auto;border:1px solid var(--line);border-bottom:0;
  -webkit-mask:radial-gradient(circle 5px at 50% 100%,transparent 97%,#000) 0 0/12px 100%;mask:radial-gradient(circle 5px at 50% 100%,transparent 97%,#000) 0 0/12px 100%}
.receipt .c{text-align:center}
.receipt .biz{font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:9px 0}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt .r span:first-child{min-width:0}
.receipt .tt{font-size:16px;font-weight:600}
.stamp{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px double var(--bad);color:var(--bad);font:700 26px var(--f-mono);letter-spacing:.18em;padding:4px 14px;opacity:.85;pointer-events:none}
.voidbox{margin-top:14px;border:1px solid var(--bad);border-radius:8px;padding:10px 12px;font-size:13px;display:grid;gap:3px}
.voidbox b{color:var(--bad)}
.febox{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:10px;background:var(--paper)}
.febox-r{display:grid;gap:3px;font-size:13px}
.febox-r+.febox-r{border-top:1px dashed var(--line);padding-top:8px}

/* reportes */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:grid;gap:4px}
.kpi b{font:600 21px var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi em{font-style:normal;font:500 11px var(--f-mono);color:var(--mute)}
.sect{margin-top:22px;display:grid;gap:10px}
.sect h3{font-size:14px;font-weight:700}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.chart{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 10px 4px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart text{font:10px var(--f-mono);fill:var(--mute)}
.chart .bar{fill:var(--ink)}
.chart .grid-l{stroke:var(--soft)}
.chart .v{fill:var(--ink);font-weight:600}
.bars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:10px;background:var(--soft);border-radius:2px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--ink)}
.hbar .n{font-family:var(--f-mono);text-align:right;font-size:12.5px}
.alertlist{display:flex;flex-wrap:wrap;gap:6px}
.alertlist span{border:1px solid currentColor;border-radius:6px;padding:4px 8px;font-size:12.5px}

/* modal */
#modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 38%,transparent);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow:auto;padding:20px;display:grid;gap:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4)}
.sheet.wide{max-width:900px}
.sheet h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.sheet h2 small{display:block;font:500 12px var(--f-mono);color:var(--mute);margin-top:3px}
.row-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.row-actions .left{margin-right:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 12px;min-height:34px;font-size:12.5px;font-weight:600}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--ink)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pinpad button{height:60px;border:1px solid var(--line);background:var(--paper);border-radius:10px;font:600 22px var(--f-mono)}
.pindots{display:flex;gap:14px;justify-content:center;padding:6px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.icopick{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.icopick button{height:48px;border:1px solid var(--line);background:var(--paper);border-radius:8px;display:grid;place-items:center}
.icopick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.icopick .ico{width:28px;height:28px}
.rcp td{padding:6px 6px}
.rcp .inp{height:38px}
.rcp select.inp{min-width:150px}
.note{font-size:12.5px;color:var(--mute)}

.pk-head{display:flex;gap:12px;align-items:center}
.pk-head .ico{width:46px;height:46px;flex:none}
.picker{max-width:680px}
.pk-sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pk-size{display:grid;justify-items:center;gap:2px;padding:12px 6px 12px;border:1px solid var(--line);background:var(--paper);border-radius:10px;transition:transform .08s}
.pk-size:active{transform:scale(.96);background:var(--soft)}
.pk-size b{font-size:14px}
.pk-size strong{font-size:16px;margin-top:4px}
.pk-size i{font-style:normal;font-size:10.5px;color:var(--mute)}
.pk-size.low i{color:var(--warn)} .pk-size.out{opacity:.5} .pk-size.out i{color:var(--bad)}
.pk-dw{height:96px;display:grid;place-items:center}
.pk-dia{position:relative;width:calc(92px * var(--d));height:calc(92px * var(--d));border:1.5px solid var(--ink);border-radius:50%;box-shadow:inset 0 0 0 4px var(--soft);overflow:hidden;display:block}
.pk-dia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.22);display:block}
.pk-dia.real img{transform:none}
.pk-size.out .pk-dia img{filter:grayscale(.85);opacity:.6}
.line-name em{display:block;font:italic 600 11.5px var(--f-ui);color:var(--ink);margin-top:1px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;align-items:start}
.receipt.kit{font-size:13.5px}
.kbig{font:600 34px var(--f-mono);text-align:center;letter-spacing:.04em;margin:2px 0 4px}
.kit-it,.kcard li{display:grid;grid-template-columns:30px 26px minmax(0,1fr);align-items:baseline;gap:2px;padding:3px 0}
.kq{font-weight:600}
.ksz{border:1.5px solid var(--ink);border-radius:3px;text-align:center;font-weight:700;font-size:12px;line-height:18px;width:20px}
.kit-it em,.kcard em{display:block;font:700 12.5px var(--f-ui);font-style:normal;margin-top:1px}
.kboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.kcol h3{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.kcards{display:grid;gap:10px;margin-top:10px}
.kcard{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;font-family:var(--f-mono)}
.kcard.late{border:2px solid var(--bad)}
.kcard header{display:flex;gap:8px;align-items:center}
.kno{font-size:26px;font-weight:600;margin-right:auto;letter-spacing:.02em}
.kcli{font:500 12px var(--f-ui);color:var(--mute)}
.kcard ul{list-style:none;margin:0;padding:0;font-size:14.5px;border-top:1px dashed var(--line);padding-top:6px}

async function withLock(ref, fn) {
  for (let i = 0; i < 24; i++) {
    let r;
    try { r = await ref.acquire({holder: TAB, ttlMs: 4000}); }
    catch (e) {
      if (e && (e.code === 'capability_removed' || e.code === 'capability_disabled')) return fn();
      if (e && e.code === 'unavailable') { await sleep(400); continue; }
      throw e;
    }
    if (r.acquired) return fn();

  }

}

function makeDB(fs) {
  const Q = q => ({where: (a, b, c) => Q(q.where(a, b, c)), orderBy: (a, d) => Q(q.orderBy(a, d)), limit: n => Q(q.limit(n)), get: () => q.get(), onSnapshot: (n, e) => q.onSnapshot(n, e)});
  const C = c => Object.assign(Q(c), {path: c.path, doc: id => D(id ? c.doc(id) : c.doc()), add: d => c.add(d)});
  const D = r => ({
    id: r.id, path: r.path, get: () => r.get(), set: d => r.set(d), update: d => r.update(d), delete: () => r.delete(),
    onSnapshot: (n, e) => r.onSnapshot(n, e), collection: p => C(r.collection(p)),
    acquire: ({holder, ttlMs = 4000}) => {
      const lk = fs.doc('locks/' + r.path.replace(/\//g, '__'));
      return fs.runTransaction(async tx => {
        const s = await tx.get(lk); const now = Date.now(); const d = s.exists ? s.data() : null;
        if (d && d.exp > now && d.holder !== holder) return {acquired: false};
        tx.set(lk, {holder, exp: now + ttlMs}); return {acquired: true};

    }
  });

}

// El usuario corto (ej. caja1) se convierte en caja1@<authDomain del proyecto>.
const USER_DOMAIN = (fbConfig() || {}).authDomain || 'spankys.firebaseapp.com';
const usuarioACorreo = u => (u = String(u || '').trim()).includes('@') ? u : u.toLowerCase().replace(/[^a-z0-9._-]/g, '') + '@' + USER_DOMAIN;
const correoAUsuario = e => String(e || '').endsWith('@' + USER_DOMAIN) ? String(e).split('@')[0].toUpperCase() : String(e || '');
const AUTH_ERR = {'auth/invalid-credential': 'Usuario o contraseña incorrectos.', 'auth/invalid-login-credentials': 'Usuario o contraseña incorrectos.', 'auth/wrong-password': 'Usuario o contraseña incorrectos.', 'auth/user-not-found': 'Usuario o contraseña incorrectos.', 'auth/invalid-email': 'Escriba un usuario válido.', 'auth/user-disabled': 'Este usuario fue desactivado. Consulte con el encargado.', 'auth/too-many-requests': 'Demasiados intentos. Espere unos minutos.', 'auth/network-request-failed': 'Sin internet. Revise la conexión.', 'auth/operation-not-allowed': 'Active "Correo electrónico/contraseña" en Firebase → Authentication.', 'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'Los datos de Firebase no son válidos.'};
let FB = null, FS = null, STARTED = false;
function boot() {
  renderRail(); go('venta');
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (typeof firebase === 'undefined') { S.offline = true; S.ready = true; refresh('all'); toast('No se pudo cargar Firebase. Revise el internet y recargue.'); return; }
  const cfg = fbConfig(); if (!cfg) { showSetup(); return; }
  try { FB = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg); } catch (e) { ls.set('fbconfig', null); showSetup('Los datos de Firebase no son válidos.'); return; }
  const fs = firebase.firestore(); FS = fs;
  try { fs.settings({ignoreUndefinedProperties: true, merge: true}); } catch {}
  try { fs.enablePersistence({synchronizeTabs: true}).catch(() => {}); } catch {}
  firebase.auth().onAuthStateChanged(async u => {
    if (!u) { if (STARTED) location.reload(); else showLogin(); return; }
    S.userEmail = u.email || ''; S.uid = u.uid;
    if (STARTED) return;
    if (!(await cargarPerfil(u))) return;
    $('#login').hidden = true; STARTED = true; startData(makeDB(fs));
  });
}
/* ---------------- usuarios: perfil, primer dueño, bloqueo ---------------- */
async function cargarPerfil(u) {
  try {
    const s = await FS.doc('usuarios/' + u.uid).get();
    if (s.exists) {
      const p = s.data();
      if (p.activo === false) { showBloqueado('Este usuario está desactivado. Consulte con el dueño del negocio.'); return null; }
      S.me = {...p, uid: u.uid};
      if (p.rol !== 'dueno') S.suc = p.sucursal || '001';
      return S.me;
    }
    const sis = await FS.doc('config/sistema').get();
    if (!sis.exists) { showPrimerDueno(u); return null; }
    showBloqueado('Este usuario existe pero todavía no tiene permisos en el sistema. El dueño debe crearlo desde Ajustes → Usuarios.');
    return null;
  } catch (e) {
    console.warn(e);
    showBloqueado(e && e.code === 'permission-denied' ? 'Firebase rechazó la consulta: revise que las reglas de seguridad estén publicadas.' : 'No se pudo verificar el usuario. Revise el internet y vuelva a intentar.');
    return null;
  }
}
function showBloqueado(msg) {
  const L = $('#login'); L.hidden = false;
  L.innerHTML = `<div class="box"><img class="logo" src="${LOGO_FULL}" alt="Spanky's"><h1>Sin acceso</h1><p>${esc(msg)}</p>
    <button class="primary" data-act="salir">Volver a la entrada</button></div>`;
}
function showPrimerDueno(u) {
  const L = $('#login'); L.hidden = false;
  L.innerHTML = `<div class="box"><img class="logo" src="${LOGO_FULL}" alt="Spanky's"><h1>Primer ingreso</h1>
    <p>Esta cuenta (<b>${esc(correoAUsuario(u.email))}</b>) quedará como <b>DUEÑO</b> del sistema: verá todas las sucursales y podrá crear los usuarios de caja, cocina y encargados.</p>
    <label class="field"><span>Nombre que se mostrará</span><input class="inp" id="pdNom" value="Dueño" maxlength="40"></label>
    <div class="err" id="pdErr"></div><button class="primary" data-act="primerDueno">Continuar como dueño</button>
    <button class="ghost" data-act="salir">No, salir</button></div>`;
}
async function primerDueno() {
  const u = firebase.auth().currentUser; if (!u) return;
  const nombre = ($('#pdNom').value || '').trim() || 'Dueño';
  const b = $('[data-act=primerDueno]'); b.disabled = true; b.textContent = 'Preparando…';
  try {
    const batch = FS.batch();
    batch.set(FS.doc('usuarios/' + u.uid), {usuario: correoAUsuario(u.email).toLowerCase(), nombre, rol: 'dueno', sucursal: '*', activo: true, creado: Date.now()});
    batch.set(FS.doc('config/sistema'), {instalado: Date.now(), por: u.uid});
    await batch.commit();
    await FS.doc('config/sucursales').set({lista: [SUC_DEF]});
    location.reload();
  } catch (e) {
    console.warn(e); b.disabled = false; b.textContent = 'Continuar como dueño';
    $('#pdErr').textContent = e && e.code === 'permission-denied' ? 'Firebase no lo permitió. Revise que las reglas nuevas estén publicadas.' : 'No se pudo completar. Revise el internet.';
  }
}
let UNSUB = [];
function startData(db) {
  S.db = db;
  refs.neg = db.doc('config/negocio'); refs.menu = db.doc('config/menu');
  refs.neg.onSnapshot(s => { S.neg = {...NEG_DEF, ...(s.exists ? s.data() : {})}; S.loaded.neg = true; refresh('neg'); }, onErr);
  refs.menu.onSnapshot(s => { S.productos = s.exists ? clone(s.data().productos || []) : []; S.loaded.menu = true; refresh('menu'); }, onErr);
  refs.fe = db.doc('config/fe');
  refs.fe.onSnapshot(s => { S.feCfg = s.exists ? s.data() : null; refresh('fe'); }, onErr);
  refs.promos = db.doc('config/promos');
  refs.promos.onSnapshot(s => { S.promos = s.exists ? clone(s.data().lista || []) : []; refresh('promos'); }, onErr);
  refs.suc = db.doc('config/sucursales');
  refs.suc.onSnapshot(s => {
    const l = s.exists ? (s.data().lista || []) : [];
    S.sucursales = l.length ? l : [SUC_DEF];
    if (esDueno() && !S.sucursales.some(x => x.id === S.suc)) { S.suc = S.sucursales[0].id; ls.set('suc', S.suc); subSuc(); }
    refresh('suc');
  }, onErr);
  db.collection('fotos').onSnapshot(s => { S.fotos = Object.fromEntries(s.docs.map(d => [d.id, d.data().img])); refresh('fotos'); }, onErr);
  if (esDueno()) db.collection('usuarios').onSnapshot(s => { S.usuarios = s.docs.map(d => ({...d.data(), uid: d.id})); refresh('usr'); }, onErr);
  subSuc();
  const vs = ROLES[S.me?.rol]?.vistas || ['venta'];
  go(vs.includes(S.view) ? S.view : vs[0]);
}
// Escucha los datos de la sucursal activa (se llama de nuevo al cambiar de sucursal).
function subSuc() {
  UNSUB.forEach(f => { try { f(); } catch {} }); UNSUB = [];
  const db = S.db; if (!db) return;
  S.inv = {}; S.facturas = []; S.comandas = []; S.next = 1; S.fsel = null; S.cart = [];
  S.loaded.inv = false; S.loaded.fact = false; S.loaded.com = false;
  refs.inv = db.doc(sp('datos/inventario')); refs.cnt = db.doc(sp('datos/contador'));
  const ok = f => typeof f === 'function' && UNSUB.push(f);
  ok(refs.inv.onSnapshot(s => { S.inv = s.exists ? clone(s.data().items || {}) : {}; S.loaded.inv = true; refresh('inv'); }, onErr));
  ok(refs.cnt.onSnapshot(s => { S.next = s.exists ? (s.data().next || 1) : 1; refresh('cnt'); }, onErr));
  S.puesto = ls.get('puesto.' + S.suc, ''); S.turnosAb = [];
  if (S.me?.rol !== 'cocina') ok(db.collection(sp('turnos')).where('estado', '==', 'abierto').onSnapshot(s => { S.turnosAb = s.docs.map(d => d.data()); refresh('caja'); }, onErr));
  if (S.me?.rol !== 'cocina') ok(db.collection(sp('facturas')).orderBy('ts', 'desc').limit(300).onSnapshot(s => { S.facturas = s.docs.map(d => d.data()); S.loaded.fact = true; refresh('fact'); }, onErr));
  ok(db.collection(sp('comandas')).where('estado', 'in', ['pendiente', 'horno', 'lista']).limit(200).onSnapshot(s => {
    const prev = new Set(S.comandas.filter(c => c.estado === 'pendiente').map(c => c.numero));
    S.comandas = s.docs.map(d => d.data()).sort((a, b) => a.ts - b.ts);
    if (S.loaded.com && S.comandas.some(c => c.estado === 'pendiente' && !prev.has(c.numero))) beep();
    S.loaded.com = true; refresh('com');
  }, onErr));
  refresh('all');
}
async function cambiarSucursal(id) {
  if (!esDueno() || id === S.suc) { closeModal(); return; }
  if (S.cart.length && !(await confirmBox('Cambiar de sucursal', 'Hay productos en la comanda actual. Si cambia de sucursal se vacía.', 'Cambiar'))) return;
  closeModal();
  S.suc = id; ls.set('suc', id); subSuc(); go(S.view); toast('Trabajando en ' + sucAct().nombre + '.');
}
async function seedDB() {
  if (!S.db || S.seeding) return;
  if (!(await confirmBox("Cargar menú inicial", "Se cargarán 15 productos (9 pizzas en 4 tamaños, bebidas y complementos), 25 ingredientes con existencias de ejemplo y los datos de SPANKY'S. Después puede cambiar todo en Menú, Inventario y Ajustes.", 'Cargar'))) return;
  S.seeding = true;
  try {
    const neg = await refs.neg.get(); if (!neg.exists) await refs.neg.set(SEED.negocio);
    const inv = await refs.inv.get(); if (!inv.exists || !Object.keys(inv.data().items || {}).length) await refs.inv.set(SEED.inventario);
    await refs.menu.set(SEED.menu);
    const pr = await refs.promos.get(); if (!pr.exists) await refs.promos.set(SEED.promos);
    const c = await refs.cnt.get(); if (!c.exists) await refs.cnt.set({next: 1});
    toast('Menú inicial cargado. Revise precios y existencias.');
  } catch (e) { console.warn(e); toast(e && e.code === 'permission-denied' ? 'Firebase rechazó la escritura: revise las reglas de Firestore.' : 'No se pudo cargar el menú inicial.'); }
  S.seeding = false;
}

function beep() {
  if (!S.sound || !AC) return;
  try { [0, .18].forEach(t => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, AC.currentTime + t); g.gain.exponentialRampToValueAtTime(.25, AC.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + t + .15); o.connect(g).connect(AC.destination); o.start(AC.currentTime + t); o.stop(AC.currentTime + t + .16); }); } catch {}
}

  const it = S.cart.find(i => i.key === key);

function cycleSize(key) {

/* ---------------- promociones, descuentos y líneas de factura ---------------- */
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const costoDe = cons => r2(Object.entries(cons || {}).reduce((a, [k, q]) => a + q * (S.inv[k]?.costo || 0), 0));
function promoVigente(pr, now = new Date()) {
  if (!pr || pr.activa === false) return false;
  if (pr.dias && pr.dias.length && !pr.dias.includes(now.getDay())) return false;
  const d = dstr(now); if (pr.desde && d < pr.desde) return false; if (pr.hasta && d > pr.hasta) return false;
  return true;
}
function califica(pr, it) {
  if (it.promo) return false; const p = prod(it.id); if (!p) return false; const c = pr.cond || {};
  if (c.prods && c.prods.length) { if (!c.prods.includes(it.id)) return false; } else if (c.cat && p.cat !== c.cat) return false;
  if (c.tamanos && c.tamanos.length && !c.tamanos.includes(it.size)) return false;
  return true;
}
const promosRegalo = () => (S.promos || []).filter(pr => pr.tipo === 'regalo');
function regalosPermitidos(pr) {
  if (!promoVigente(pr)) return 0;
  const q = S.cart.filter(it => califica(pr, it)).reduce((a, it) => a + it.qty, 0);
  return Math.floor(q / Math.max(1, +pr.cond?.cant || 1)) * Math.max(1, +pr.regalo?.cant || 1);
}
// Quita regalos que ya no corresponden (si se quitó la pizza, o se pasaron de la cantidad)
function ajustarRegalos() {
  const ids = new Set(promosRegalo().map(p => p.id));
  S.cart = S.cart.filter(it => !it.promo || ids.has(it.promo));
  for (const pr of promosRegalo()) {
    let sobra = S.cart.filter(it => it.promo === pr.id).reduce((a, it) => a + it.qty, 0) - regalosPermitidos(pr);
    for (let i = S.cart.length - 1; i >= 0 && sobra > 0; i--) { const it = S.cart[i]; if (it.promo !== pr.id) continue; const k = Math.min(it.qty, sobra); it.qty -= k; sobra -= k; }
  }
  S.cart = S.cart.filter(it => it.qty > 0);
}
function promoSugerencias() {
  return promosRegalo().map(pr => ({pr, faltan: regalosPermitidos(pr) - S.cart.filter(it => it.promo === pr.id).reduce((a, it) => a + it.qty, 0)})).filter(x => x.faltan > 0 && prod(x.pr.regalo?.prod));
}
function promoAdd(id) {
  const pr = promosRegalo().find(p => p.id === id); if (!pr) return;
  const p = prod(pr.regalo.prod); if (!p) return toast('El producto de regalo ya no está en el menú.');
  addToCart(p.id, pr.regalo.tam && p.tamanos.includes(pr.regalo.tam) ? pr.regalo.tam : p.tamanos[0], '', [], pr);
}
// Líneas de la factura: cada extra va en su propia línea. El descuento se reparte proporcionalmente (lo pide Hacienda por línea).
function lineasFactura(desc) {
  const out = [];
  for (const it of S.cart) {
    const p = prod(it.id);
    out.push({id: it.id, nombre: it.nombre, size: it.size, precio: it.precio, qty: it.qty, total: r2(it.precio * it.qty), nota: it.nota || '', cabys: p?.cabys || '',
      extras: (it.extras || []).map(e => e.nombre), ...(it.promo ? {promo: it.promoNombre || 'Promoción', precioLista: it.precioLista || 0} : {})});
    for (const e of it.extras || []) out.push({id: e.id, nombre: e.nombre, size: 'U', precio: e.precio, qty: it.qty, total: r2(e.precio * it.qty), nota: '', cabys: prod(e.id)?.cabys || '', extra: true, de: it.nombre});
  }
  const base = out.reduce((a, l) => a + l.total, 0);
  if (desc > 0 && base > 0) { let resto = r2(desc); out.forEach((l, i) => { const d = i === out.length - 1 ? resto : r2(desc * l.total / base); l.descuento = Math.min(l.total, d); resto = r2(resto - l.descuento); }); }
  return out;
}

    if (!esSuper() && !(await askPin('Autorizar consumo interno'))) return;
  }
  ajustarRegalos();
  const total = esCI ? 0 : cartTotal();
  const rec = S.pago === 'efectivo' ? (S.recibido === '' ? total : parseFloat(S.recibido) || 0) : total;
  if (!esCI && S.pago === 'efectivo' && rec < total - 0.001) return toast('El efectivo recibido no cubre el total.');
  const nit = esCI ? '' : (S.cliente.nit || '').trim();
  const nombre = esCI ? 'Consumo: ' + S.consumoPara : (S.cliente.nombre || '').trim() || (nit ? '' : 'Cliente contado');
  if (nit && !nombre) { toast('Escriba el nombre del cliente para esa cédula.'); $('#tkNom')?.focus(); return; }

      esCI ? 'Registrar de todas formas' : 'Vender de todas formas');
    if (!ok) return;
  }
  S.busy = true; updateTotals();
  const {sub, iva} = split(total);
  const caj = cajeroActual();
  try {
    const f = await withLock(refs.inv, async () => {
      const invS = await refs.inv.get(); const inv = clone(invS.exists ? invS.data() : {items: {}}); inv.items = inv.items || {};
      const cS = await refs.cnt.get(); const cnt = cS.exists ? cS.data() : {}; let n = esCI ? (cnt.nextCI || 1) : (cnt.next || 1);
      const suc = sucAct(); const serie = esCI ? 'CI' : (suc.serie || 'A');
      let numero = `${serie}-${pad(n)}`;
      for (let guard = 0; guard < 50; guard++) { const ex = await S.db.doc(sp('facturas/' + numero)).get(); if (!ex.exists) break; n++; numero = `${serie}-${pad(n)}`; }
      for (const [k, q] of Object.entries(consumo)) if (inv.items[k]) inv.items[k].stock = r3(inv.items[k].stock - q);
      const now = Date.now();
      const fac = {
        numero, serie, n, ts: now, fecha: new Date(now).toISOString(), cajero: caj, usuario: S.me?.usuario || '', uid: S.uid, tipo: S.tipo,
        sucursal: suc.id, sucursalNombre: suc.nombre, caja: turno ? turno.caja : '', turno: turno ? turno.id : '',
        cliente: {nit, nombre, correo},
        items: lineasFactura(esCI ? 0 : descMonto()),
        bruto: esCI ? 0 : cartBruto(), descuento: !esCI && S.desc ? {...S.desc, monto: descMonto()} : null,
        promos: [...new Set(S.cart.filter(i => i.promo).map(i => i.promoNombre))],
        total, subtotal: sub, iva, ivaPct: +S.neg.iva || 0, pago: esCI ? 'consumo' : S.pago, recibido: esCI ? 0 : r2(rec), cambio: !esCI && S.pago === 'efectivo' ? r2(rec - total) : 0,
        estado: esCI ? 'consumo' : 'emitida', tipoDoc: esCI ? 'consumo' : 'venta', consumo, costo: costoDe(consumo),
        ...(esCI ? {consumoPara: S.consumoPara, valorMenu: cartBruto()} : {}),
        negocio: {nombre: S.neg.nombre || '', nit: S.neg.nit || '', direccion: suc.direccion || S.neg.direccion || '', telefono: suc.telefono || S.neg.telefono || '', pie: S.neg.pie || '', sucursal: S.sucursales.length > 1 ? suc.nombre : ''}
      };
      await refs.inv.set(inv);
      await refs.cnt.set(esCI ? {...cnt, nextCI: n + 1} : {...cnt, next: n + 1});
      await S.db.doc(sp('facturas/' + numero)).set(fac);

    });
    const k = kitchenOf(f);
    try { await S.db.doc(sp('comandas/' + f.numero)).set(k); } catch (e) { console.warn(e); toast('La venta se guardó, pero la comanda no llegó a cocina. Avise a cocina.'); }
    S.cart = []; S.recibido = ''; S.cliente = CLI_DEF(); S.pago = 'efectivo'; S.desc = null; S.consumo = false; S.consumoPara = '';
    S.lastF = f; S.busy = false;
    renderGrid(); renderTicket();
    openModal(`<div class="sheet wide"><div class="pair">
        <div><div class="lbl" style="text-align:center;margin-bottom:8px">${esCI ? 'Consumo interno' : 'Comprobante del cliente'}</div><div class="receipt">${receiptHTML(f)}</div></div>

  } catch (e) {
    console.warn(e); S.busy = false; updateTotals();

/* ---------------- CAJAS: apertura, entradas/salidas, arqueo y cierre ----------------
   Datos: sucursales/<suc>/turnos/<id> = un turno de una caja (puesto) desde que se abre hasta que se cierra.
   { id, caja:'1', cajaNombre, sucursal, estado:'abierto'|'cerrado', ts (apertura), fondo, abre:{por,usuario,uid},
     movs:[{tipo:'entrada'|'salida',monto,motivo,ts,por}], arqueos:[{ts,por,contado,esperado,dif}], cierre:{…} }
   Cada factura guarda caja y turno. Cierre ciego: el cajero cuenta sin ver el esperado; confirma un supervisor con PIN. */
const refCajas = () => S.db.doc(sp('datos/cajas'));
const sumM = (t, k) => r2((t.movs || []).filter(m => m.tipo === k).reduce((a, m) => a + (+m.monto || 0), 0));
function resumenTurno(t, facs) {
  const em = facs.filter(f => f.estado === 'emitida'), an = facs.filter(f => f.estado === 'anulada');
  const by = k => r2(em.filter(f => f.pago === k).reduce((a, f) => a + f.total, 0));
  const efectivo = by('efectivo'), entradas = sumM(t, 'entrada'), salidas = sumM(t, 'salida');
  return {n: em.length, total: r2(em.reduce((a, f) => a + f.total, 0)), efectivo, tarjeta: by('tarjeta'), transferencia: by('transferencia'),
    anuladas: an.length, montoAnulado: r2(an.reduce((a, f) => a + f.total, 0)), entradas, salidas, esperado: r2((+t.fondo || 0) + efectivo + entradas - salidas)};
}
async function calcTurno(t) {
  const q = await S.db.collection(sp('facturas')).where('turno', '==', t.id).get();
  return resumenTurno(t, q.docs.map(d => d.data()));
}

function receiptText(f) {

  const lr = (l, r) => { l = String(l); r = String(r); return l + ' '.repeat(Math.max(1, W - l.length - r.length)) + r; };
  const L = [c((b.nombre || '').toUpperCase())]; if (b.sucursal) L.push(c('Sucursal ' + b.sucursal)); if (b.nit) L.push(c('Ced. juridica ' + b.nit)); if (b.direccion) L.push(c(b.direccion));
  L.push('-'.repeat(W), c('No. ' + f.numero), lr(fdate(f.ts), ftime(f.ts)), f.cliente.nombre); if (f.cliente.nit) L.push(lr('Cedula', f.cliente.nit)); L.push('-'.repeat(W));
  f.items.forEach(it => { if (it.extra) { L.push(lr('  + ' + it.nombre, money(it.total))); return; } L.push(it.nombre + (it.size !== 'U' ? ' ' + (SIZES[it.size]?.l || it.size) : '') + (it.promo ? ' (regalo)' : '')); L.push(lr('  ' + it.qty + ' x ' + money(it.precio), money(it.total))); });
  if (f.descuento) L.push('-'.repeat(W), lr('Antes de descuento', money(f.bruto)), lr('Descuento', '-' + money(f.descuento.monto)));
  L.push('-'.repeat(W), lr('Subtotal', money(f.subtotal)), lr('IVA ' + f.ivaPct + '%', money(f.iva)), lr('TOTAL', money(f.total)));
  if (f.pago === 'efectivo') L.push(lr('Efectivo', money(f.recibido)), lr('Cambio', money(f.cambio)));

async function feRetry(numero, campo) {
  const f = S.facturas.find(x => x.numero === numero); if (!f || !f[campo]) return;
  if (f[campo].estado === 'rechazado' && !(await confirmBox('Emitir de nuevo', `<p style="margin:0">Hacienda rechazó este comprobante:</p><p style="margin:0" class="bad">${esc(f[campo].mensaje || '')}</p><p class="note" style="margin:0">Corrija primero lo que indica el mensaje (por ejemplo en Ajustes o el código CABYS del producto). Se emitirá un comprobante nuevo con otro consecutivo.</p>`, 'Emitir de nuevo'))) return;
  try { await S.db.doc(sp('facturas/' + numero)).update({[campo + '.reintentar']: true}); toast('Reintento solicitado.'); }
  catch { toast('No se pudo solicitar el reintento.'); }
}
async function anularFlow(numero) {
  const f = S.facturas.find(x => x.numero === numero); if (!f || !['emitida', 'consumo'].includes(f.estado)) return;
  let motivo = '';
  const res = await dialog(`<h2>Anular ${esc(numero)}<small>${fdt(f.ts)} · ${esc(f.cliente?.nombre)} · ${money(f.total)}</small></h2>
    <div class="field"><span>Motivo</span><div class="chips" id="anChips">${MOTIVOS.map(m => `<button data-act="anChip" data-v="${esc(m)}" aria-pressed="false">${esc(m)}</button>`).join('')}</div>
    <textarea class="inp" id="anMot" placeholder="Describa el motivo (obligatorio)"></textarea></div>
    <label class="check"><input type="checkbox" id="anDev" checked><span>Devolver los ingredientes al inventario.<br><span class="note">Desmárquelo si la pizza ya se preparó y se desechó: el consumo queda como merma.</span></span></label>
    <div class="row-actions"><button class="ghost" data-act="m-cancel">Cancelar</button><button class="danger" data-act="m-ok">Continuar</button></div>`, '',
    () => { motivo = $('#anMot').value.trim(); if (motivo.length < 3) { toast('Escriba el motivo de la anulación.'); $('#anMot').focus(); return false; } return {motivo, devolver: $('#anDev').checked}; });
  if (!res) return;
  if (!esSuper() && !(await askPin('Autorizar anulación'))) return;
  try {
    await withLock(refs.inv, async () => {
      const ref = S.db.doc(sp('facturas/' + numero));
      const fs = await ref.get();
      if (!fs.exists || fs.data().estado === 'anulada') throw {code: 'ya'};
      if (res.devolver) {
        const invS = await refs.inv.get(); const inv = clone(invS.data() || {items: {}});
        for (const [k, q] of Object.entries(fs.data().consumo || {})) if (inv.items[k]) inv.items[k].stock = r3(inv.items[k].stock + q);
        await refs.inv.set(inv);
      }
      await ref.update({estado: 'anulada', anulacion: {motivo: res.motivo, ts: Date.now(), cajero: cajeroActual(), devuelto: res.devolver}});
    });
    try { const kr = S.db.doc(sp('comandas/' + numero)); if ((await kr.get()).exists) await kr.update({estado: 'anulada', tsEstado: Date.now()}); } catch {}
    toast(`Factura ${numero} anulada.`);
  } catch (e) { toast(e && e.code === 'ya' ? 'Esa factura ya estaba anulada.' : 'No se pudo anular. Intente de nuevo.'); }
}

function stState(i) { return i.stock <= 0 ? 'bad' : i.stock <= (i.minimo || 0) ? 'warn' : 'ok'; }

  const b = $('#iBody'); if (!b) return;
  const all = Object.entries(S.inv).map(([id, i]) => ({id, ...i})).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  const nb = all.filter(i => stState(i) === 'warn').length, na = all.filter(i => stState(i) === 'bad').length;
  $('#iSub').textContent = `${S.sucursales.length > 1 ? sucAct().nombre + ' · ' : ''}${all.length} ingredientes · ${nb} bajo mínimo · ${na} agotados`;
  $('#iFil').innerHTML = [['todos', 'Todos'], ['bajo', `Bajo mínimo ${nb + na ? '(' + (nb + na) + ')' : ''}`]].map(([k, l]) => `<button data-act="ifil" data-v="${k}" aria-pressed="${S.ifil === k}">${l}</button>`).join('');
  const q = S.iq.trim().toLowerCase();

  if (!list.length) { b.innerHTML = `<div class="empty"><b>Nada que mostrar con ese filtro</b></div>`; return; }
  b.innerHTML = `<div class="tbl"><table><thead><tr><th>Ingrediente</th><th class="n">Existencia</th><th class="n">Mínimo</th><th>Nivel</th><th class="n">Costo</th><th class="n">Valor</th><th></th></tr></thead><tbody>
    ${list.map(i => {
      const st = stState(i); const U = UNITS[i.unidad] || UNITS.unidad;

        <td><div class="row" style="flex-wrap:nowrap"><div class="meter ${st}"><i style="width:${(pct * 100).toFixed(0)}%"></i></div>${st === 'ok' ? '' : `<span class="pill ${st}">${st === 'bad' ? 'Agotado' : 'Bajo'}</span>`}</div></td>
        <td class="n mute">${i.costo ? money(i.costo * U.f) + '/' + U.big : '—'}</td><td class="n">${i.costo ? money(Math.max(0, i.stock) * i.costo) : '—'}</td>
        <td><div class="acts"><button class="primary sm" data-act="ingIn" data-id="${esc(i.id)}">Entrada</button><button class="ghost sm" data-act="ingCount" data-id="${esc(i.id)}">Conteo</button><button class="ghost sm" data-act="ingMerma" data-id="${esc(i.id)}">Merma</button><button class="ghost sm" data-act="ingEdit" data-id="${esc(i.id)}">Editar</button></div></td></tr>`;
    }).join('')}</tbody>

}
async function invMove(id, mode) {
  const i = S.inv[id]; if (!i) return;
  if (mode === 'conteo' && !esSuper() && !(await askPin('Ajuste por conteo físico'))) return;
  const U = UNITS[i.unidad] || UNITS.unidad;
  const quick = i.unidad === 'unidad' ? [1, 6, 12, 24] : [500, 1000, 5000];
  const res = await dialog(`<h2>${mode === 'entrada' ? 'Entrada' : 'Conteo físico'} · ${esc(i.nombre)}<small>Existencia en sistema: ${fmtQty(i.stock, i.unidad)}</small></h2>
    <label class="field"><span>${mode === 'entrada' ? 'Cantidad que ingresa' : 'Existencia contada'} (${U.l})</span><input class="inp num" id="mvQ" inputmode="decimal" style="font-size:20px;height:52px"></label>
    ${mode === 'entrada' ? `<div class="quick">${quick.map(v => `<button data-act="mvAdd" data-v="${v}">+${nf(v)} ${U.l}</button>`).join('')}</div>` : `<div class="note" id="mvDiff">Escriba lo que contó en bodega; el sistema registra la diferencia.</div>`}
    <label class="field"><span>Nota</span><input class="inp" id="mvN" placeholder="${mode === 'entrada' ? 'Proveedor y número de factura de compra' : 'Ej. conteo de cierre semanal'}"></label>
    <div class="row-actions"><button class="ghost" data-act="m-cancel">Cancelar</button><button class="primary" data-act="m-ok">Guardar</button></div>`, '',
    () => { const v = parseFloat($('#mvQ').value); if (!(v >= 0) || (mode === 'entrada' && !(v > 0))) { toast('Escriba una cantidad válida.'); return false; } return {v, nota: $('#mvN').value.trim()}; });
  if (!res) return;
  try {
    await withLock(refs.inv, async () => {
      const invS = await refs.inv.get(); const inv = clone(invS.data() || {items: {}}); const it = inv.items[id]; if (!it) throw {code: 'gone'};
      const antes = it.stock; it.stock = r3(mode === 'entrada' ? antes + res.v : res.v);
      await refs.inv.set(inv);
      await S.db.collection(sp('movimientos')).add({tipo: mode === 'entrada' ? 'entrada' : 'ajuste', ing: id, nombre: it.nombre, unidad: it.unidad, cantidad: r3(it.stock - antes), antes, despues: it.stock, nota: res.nota, ts: Date.now(), cajero: cajeroActual()});
    });
    toast(mode === 'entrada' ? 'Entrada registrada.' : 'Conteo registrado.');
  } catch (e) { toast('No se pudo guardar el movimiento. Intente de nuevo.'); }
}

const MOTIVOS_MERMA = ['Vencido', 'Dañado', 'Se quemó', 'Se cayó', 'Mal preparado', 'Prueba de receta'];
const mermaChips = () => `<div class="chips" id="mmChips">${MOTIVOS_MERMA.map(m => `<button data-act="mmChip" data-v="${esc(m)}" aria-pressed="false">${esc(m)}</button>`).join('')}</div>`;
// Merma de un ingrediente: sale del inventario con su motivo y su costo.
async function invMerma(id) {
  const i = S.inv[id]; if (!i) return; const U = UNITS[i.unidad] || UNITS.unidad;
  const res = await dialog(`<h2>Merma · ${esc(i.nombre)}<small>Existencia en sistema: ${fmtQty(i.stock, i.unidad)}</small></h2>
    <label class="field"><span>Cantidad que se pierde (${U.l})</span><input class="inp num" id="mmQ" inputmode="decimal" style="font-size:20px;height:52px"></label>
    <div class="field"><span>Motivo</span>${mermaChips()}<input class="inp" id="mmN" placeholder="Motivo o detalle (obligatorio)"></div>
    <div class="row-actions"><button class="ghost" data-act="m-cancel">Cancelar</button><button class="danger" data-act="m-ok">Registrar merma</button></div>`, '',
    () => { const v = parseFloat($('#mmQ').value.replace(',', '.')); const n = $('#mmN').value.trim(); if (!(v > 0)) { toast('Escriba la cantidad.'); return false; } if (n.length < 3) { toast('Escriba el motivo.'); return false; } return {v, n}; });
  if (!res) return;
  try {
    await withLock(refs.inv, async () => {
      const g = await refs.inv.get(); const inv = clone(g.data() || {items: {}}); const it = inv.items[id]; if (!it) throw {code: 'gone'};
      const antes = it.stock; it.stock = r3(antes - res.v); await refs.inv.set(inv);
      await S.db.collection(sp('movimientos')).add({tipo: 'merma', ing: id, nombre: it.nombre, unidad: it.unidad, cantidad: r3(-res.v), antes, despues: it.stock, nota: res.n, costo: r2(res.v * (it.costo || 0)), ts: Date.now(), cajero: cajeroActual()});
    });
    toast('Merma registrada.');
  } catch (e) { toast('No se pudo registrar la merma.'); }
}
// Merma de un producto preparado (ej. una pizza que se quemó): rebaja toda su receta.
async function mermaProducto() {
  const vend = S.productos.filter(p => p.cat !== 'extra' || true);
  const res = await dialog(`<h2>Merma de producto<small>Rebaja del inventario todos los ingredientes de su receta</small></h2>
    <div class="grid2"><label class="field" style="grid-column:1/-1"><span>Producto</span><select class="inp" id="mpP">${vend.map(p => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('')}</select></label>
      <label class="field"><span>Tamaño</span><select class="inp" id="mpT">${['U', ...PIZZA_SIZES].map(t => `<option value="${t}" ${t === 'M' ? 'selected' : ''}>${t === 'U' ? 'Único' : SIZES[t].l}</option>`).join('')}</select></label>
      <label class="field"><span>Cantidad</span><input class="inp num" id="mpQ" inputmode="numeric" value="1"></label></div>
    <div class="field"><span>Motivo</span>${mermaChips()}<input class="inp" id="mmN" placeholder="Motivo o detalle (obligatorio)"></div>
    <div class="row-actions"><button class="ghost" data-act="m-cancel">Cancelar</button><button class="danger" data-act="m-ok">Registrar merma</button></div>`, '',
    () => { const p = prod($('#mpP').value); let t = $('#mpT').value; const q = parseInt($('#mpQ').value, 10); const n = $('#mmN').value.trim();
      if (!p) return false; if (!p.tamanos.includes(t)) t = p.tamanos[0]; if (!(q >= 1)) { toast('Escriba la cantidad.'); return false; } if (n.length < 3) { toast('Escriba el motivo.'); return false; }
      if (!Object.keys(recipeOf(p, t)).length) { toast('Ese producto no tiene receta: no hay nada que rebajar.'); return false; }
      return {p, t, q, n}; });
  if (!res) return;
  const cons = consumoOf([{id: res.p.id, size: res.t, qty: res.q}]);
  const det = `${res.q} × ${res.p.nombre}${res.t !== 'U' ? ' ' + SIZES[res.t].l : ''}`;
  try {
    const grupo = 'mp-' + Date.now().toString(36);
    await withLock(refs.inv, async () => {
      const g = await refs.inv.get(); const inv = clone(g.data() || {items: {}}); const movs = [];
      for (const [k, q] of Object.entries(cons)) { const it = inv.items[k]; if (!it) continue; const antes = it.stock; it.stock = r3(antes - q);
        movs.push({tipo: 'merma', ing: k, nombre: it.nombre, unidad: it.unidad, cantidad: r3(-q), antes, despues: it.stock, nota: `${det}: ${res.n}`, costo: r2(q * (it.costo || 0)), producto: res.p.id, grupo, ts: Date.now(), cajero: cajeroActual()}); }
      await refs.inv.set(inv);
      for (const m of movs) await S.db.collection(sp('movimientos')).add(m);
    });
    toast(`Merma registrada: ${det}.`);
  } catch (e) { toast('No se pudo registrar la merma.'); }
}

async function ingEdit(id) {
  const isNew = !id; const i = isNew ? {nombre: '', unidad: 'g', stock: 0, minimo: 0, costo: 0} : S.inv[id]; if (!i) return;
  const usedBy = isNew ? [] : S.productos.filter(p => Object.values(p.receta || {}).some(r => r[id] > 0)).map(p => p.nombre);
  const unitOpts = Object.entries(UNITS).map(([k, u]) => `<option value="${k}" ${i.unidad === k ? 'selected' : ''}>${k === 'unidad' ? 'Unidades' : k === 'g' ? 'Gramos (g)' : 'Mililitros (ml)'}</option>`).join('');
  const U = UNITS[i.unidad] || UNITS.unidad;
  const res = await dialog(`<h2>${isNew ? 'Nuevo ingrediente' : 'Editar ' + esc(i.nombre)}</h2>
    <label class="field"><span>Nombre</span><input class="inp" id="igN" value="${esc(i.nombre)}" ${esDueno() ? '' : 'disabled'}></label>
    <div class="grid2">
      <label class="field"><span>Unidad de medida</span><select class="inp" id="igU" ${isNew ? '' : 'disabled'}>${unitOpts}</select></label>
      <label class="field"><span>Mínimo (alerta) <i id="igUl1" style="font-style:normal">${U.l}</i></span><input class="inp num" id="igMin" inputmode="decimal" value="${i.minimo || 0}"></label>
      <label class="field"><span>Costo por <i id="igUl2" style="font-style:normal">${U.big}</i> (${esc(sym())})</span><input class="inp num" id="igC" inputmode="decimal" value="${i.costo ? r2(i.costo * U.f) : ''}"></label>
      ${isNew ? `<label class="field"><span>Existencia inicial <i id="igUl3" style="font-style:normal">${U.l}</i></span><input class="inp num" id="igS" inputmode="decimal" value="0"></label>` : ''}
    </div>
    ${S.sucursales.length > 1 ? `<p class="note" style="margin:0">${isNew ? 'El ingrediente se crea en todas las sucursales; la existencia inicial es solo para ' + esc(sucAct().nombre) + '.' : 'El nombre y el costo se actualizan en todas las sucursales; el mínimo es solo de ' + esc(sucAct().nombre) + '.'}</p>` : ''}
    ${isNew ? '' : `<p class="note" style="margin:0">${usedBy.length ? 'Se usa en: ' + esc(usedBy.join(', ')) + '.' : 'No se usa en ninguna receta.'} La unidad no se puede cambiar porque las recetas dependen de ella. Para cambiar la existencia use Entrada o Conteo.</p>`}
    <div class="row-actions">${isNew || !esDueno() ? '' : `<button class="danger left" data-act="m-del" ${usedBy.length ? 'disabled title="Quítelo primero de las recetas"' : ''}>Eliminar</button>`}<button class="ghost" data-act="m-cancel">Cancelar</button><button class="primary" data-act="m-ok">Guardar</button></div>`, '',
    () => {
      const nombre = $('#igN').value.trim(); if (!nombre) { toast('Escriba el nombre.'); return false; }
      const unidad = $('#igU').value; const Uu = UNITS[unidad];
      return {nombre, unidad, minimo: parseFloat($('#igMin').value) || 0, costo: (parseFloat($('#igC').value) || 0) / Uu.f, stock: isNew ? (parseFloat($('#igS').value) || 0) : undefined};
    });
  if (!res) return;
  try {
    if (res === 'del') {
      if (!(await confirmBox('Eliminar ingrediente', `¿Eliminar <b>${esc(i.nombre)}</b> del inventario?`, 'Eliminar'))) return;
      await withLock(refs.inv, async () => { const s = await refs.inv.get(); const inv = clone(s.data() || {items: {}}); delete inv.items[id]; await refs.inv.set(inv); });
      await enOtrasSucursales(items => { if (!items[id]) return false; delete items[id]; });
      toast('Ingrediente eliminado.'); return;
    }
    let nuevoId = id;
    await withLock(refs.inv, async () => {
      const s = await refs.inv.get(); const inv = clone(s.exists ? s.data() : {items: {}}); inv.items = inv.items || {};
      if (isNew) {
        let nid = res.nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'ing';
        while (inv.items[nid]) nid += '-' + Math.random().toString(36).slice(2, 5);
        inv.items[nid] = {nombre: res.nombre, unidad: res.unidad, stock: r3(res.stock), minimo: res.minimo, costo: res.costo}; nuevoId = nid;
      } else {
        const it = inv.items[id]; if (!it) throw {code: 'gone'};
        Object.assign(it, {nombre: res.nombre, minimo: res.minimo, costo: res.costo});
      }
      await refs.inv.set(inv);
    });
    if (esDueno()) await enOtrasSucursales(items => {
      if (isNew) { if (items[nuevoId]) return false; items[nuevoId] = {nombre: res.nombre, unidad: res.unidad, stock: 0, minimo: res.minimo, costo: res.costo}; }
      else { const it = items[id]; if (!it) return false; it.nombre = res.nombre; it.costo = res.costo; }
    });
    toast(isNew ? 'Ingrediente agregado.' : 'Cambios guardados.');
  } catch (e) { toast('No se pudo guardar. Intente de nuevo.'); }
}

// Aplica un cambio al inventario de las demás sucursales (catálogo de ingredientes compartido).
async function enOtrasSucursales(fn) {
  for (const su of S.sucursales) {
    if (su.id === S.suc) continue;
    const ref = S.db.doc(sp('datos/inventario', su.id));
    try { await withLock(ref, async () => { const g = await ref.get(); const inv = clone(g.exists ? g.data() : {items: {}}); inv.items = inv.items || {}; if (fn(inv.items) !== false) await ref.set(inv); }); }
    catch (e) { console.warn(e); toast('No se pudo actualizar el inventario de ' + su.nombre + '.'); }
  }
}

function reducirFoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const W = 480, H = 360, c = document.createElement('canvas'); c.width = W; c.height = H;
      const k = Math.max(W / img.width, H / img.height), w = img.width * k, h = img.height * k;
      c.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h); URL.revokeObjectURL(url);
      let out = c.toDataURL('image/webp', .8); if (!out.startsWith('data:image/webp')) out = c.toDataURL('image/jpeg', .82);
      res(out);
    };
    img.onerror = rej; img.src = url;
  });
}

async function exportCSV() {
  const D = S.rep.data; if (!D) return;
  const q = v => { v = v == null ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  let rows = [];
  const tab = S.rep.tab;
  if (tab === 'ventas') {
    rows.push(['Sucursal', 'Factura', 'Fecha', 'Hora', 'Estado', 'Cajero', 'Tipo', 'Cédula', 'Cliente', 'Producto', 'Tamaño', 'Indicación', 'Cantidad', 'Precio', 'Total línea', 'Total factura', 'IVA', 'Pago']);
    D.facs.forEach(f => f.items.forEach(it => rows.push([sucOf(f.sucursal).nombre, f.numero + (f.tipoDoc === 'consumo' ? ' (consumo interno)' : ''), fdate(f.ts), ftime(f.ts), f.estado, f.cajero, f.tipo, f.cliente?.nit, f.cliente?.nombre, it.nombre, it.size, it.nota || '', it.qty, it.precio, it.total, f.total, f.iva, f.pago])));
  } else if (tab === 'cajas') {
    rows.push(['Sucursal', 'Caja', 'Apertura', 'Abrió', 'Cierre', 'Cerró', 'Autorizó', 'Fondo', 'Ventas', 'Efectivo', 'Tarjeta', 'Transferencia', 'Entradas', 'Salidas', 'Esperado', 'Contado', 'Diferencia', 'Nota']);
    (D.turnos || []).forEach(t => { const c = t.cierre || {}; rows.push([sucOf(t.sucursal).nombre, t.cajaNombre || cajaNom(t.caja), fdt(t.ts), t.abre?.por, c.ts ? fdt(c.ts) : 'Abierta', c.por, c.autoriza, t.fondo, c.total, c.efectivo, c.tarjeta, c.transferencia, c.entradas, c.salidas, c.esperado, c.contado, c.dif, c.nota]); });
  } else if (tab === 'ingredientes') {
    const cons = {}; D.facs.filter(f => f.estado === 'emitida').forEach(f => Object.entries(f.consumo || {}).forEach(([k, v]) => cons[k] = (cons[k] || 0) + v));
    rows.push(['Ingrediente', 'Unidad', 'Consumido', 'Existencia actual', 'Mínimo', 'Costo por unidad', 'Costo consumido']);
    Object.entries(D.inv).forEach(([k, i]) => rows.push([i.nombre, i.unidad, r3(cons[k] || 0), i.stock, i.minimo, i.costo, r2((cons[k] || 0) * (i.costo || 0))]));
  } else {
    rows.push(['Sucursal', 'Factura', 'Emitida', 'Anulada', 'Cédula', 'Cliente', 'Autorizó', 'Motivo', 'Ingredientes devueltos', 'Total']);
    D.facs.filter(f => f.estado === 'anulada').forEach(f => rows.push([sucOf(f.sucursal).nombre, f.numero, fdt(f.ts), fdt(f.anulacion?.ts), f.cliente?.nit, f.cliente?.nombre, f.anulacion?.cajero, f.anulacion?.motivo, f.anulacion?.devuelto ? 'Sí' : 'No', f.total]));
  }
  const csv = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
    a.download = `${tab}_${D.multi ? 'todas' : sucOf(D.ids?.[0] || S.suc).nombre.toLowerCase().replace(/[^a-z0-9]+/g, '-')}_${dstr(new Date(D.a))}_${dstr(new Date(D.b - 1))}.csv`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Archivo descargado.');
  } catch { toast('No se pudo generar el archivo.'); }
}

async function feGuardarCred(a) {
  const u = $('#feU_' + a).value.trim(), pw = $('#feP_' + a).value, pin = $('#feN_' + a).value.trim(), file = $('#feK_' + a).files[0];
  if (!/@/.test(u)) return toast('Pegue el usuario completo, con @ y el dominio.');
  if (!pw) return toast('Escriba la contraseña.');
  if (!/^\d{4}$/.test(pin)) return toast('El PIN de la llave tiene 4 dígitos.');
  if (!file) return toast('Seleccione el archivo de la llave criptográfica (.p12).');
  if (file.size > 20000) return toast('Ese archivo no parece una llave criptográfica .p12.');
  const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
  try {
    await S.db.doc('privado/fe_' + a).set({usuario: u, password: pw, pin, p12: b64, ts: Date.now()});
    await S.db.doc('config/fe').set({['cred_' + a]: {ts: Date.now(), usuario: u.replace(/^(.{6}).*(@.*)$/, '$1…$2')}}, {merge: true});
    ['feU_', 'feP_', 'feN_', 'feK_'].forEach(k => { $('#' + k + a).value = ''; });
    toast('Credenciales guardadas.'); viewAjustes();
  } catch (e) { toast(e && e.code === 'permission-denied' ? 'Firebase rechazó el guardado: publique las reglas nuevas de seguridad.' : 'No se pudieron guardar las credenciales.'); }
}
async function ajSave() {

    mult: {P: parseFloat(v('ajMP')) || .6, M: 1, G: parseFloat(v('ajMG')) || 1.5, F: parseFloat(v('ajMF')) || 2}};

    actividad: g('feAct').replace(/\D/g, ''), cabysDefault: g('feCab').replace(/\D/g, ''), proveedorSistemas: g('fePrv').replace(/\D/g, ''),
    terminal: parseInt(g('feTer'), 10) || 1,

      provincia: g('feProv'), canton: g('feCan').padStart(2, '0'), distrito: g('feDis').padStart(2, '0'), barrio: g('feBar'), otrasSenas: g('feSen')}};
  if (fe.activo) {
    const faltan = [];
    if (!fe.emisor.nombre) faltan.push('razón social'); if (!idTipo(fe.emisor.numero)) faltan.push('cédula del emisor'); if (!correoOK(fe.emisor.correo)) faltan.push('correo del emisor');

    if (faltan.length) return toast('Para activar la facturación electrónica falta: ' + faltan.join(', ') + '.');
    if (fe.ambiente === 'production' && S.feCfg?.ambiente !== 'production' && !(await confirmBox('Pasar a producción', 'Desde ahora cada venta se enviará a Hacienda como comprobante real, con valor fiscal. ¿Continuar?', 'Pasar a producción'))) return;
  }

    await refs.neg.set({...S.neg, ...data});
    toast('Ajustes guardados.');

        if (d.serie && d.serie !== sucAct().serie) await withLock(refs.suc, async () => { const g = await refs.suc.get(); const l = clone(g.exists ? g.data().lista || [SUC_DEF] : [SUC_DEF]); const k = l.findIndex(x => x.id === S.suc); if (k >= 0 && !l.some(x => x.serie === d.serie)) { l[k].serie = d.serie; await refs.suc.set({lista: l}); } });
        hecho.push('datos del negocio');
      }
    }
    if (res.o.hist) {
      const f = await ofs.collection('facturas').orderBy('ts', 'desc').limit(3000).get();
      for (const d of f.docs) {
        const x = d.data(); if (x.negocio) x.negocio.nombre = sinRios(x.negocio.nombre);

      }
      const mv = await ofs.collection('movimientos').orderBy('ts', 'desc').limit(3000).get();
      for (const d of mv.docs) await S.db.doc(sp('movimientos/' + d.id)).set(d.data());
      const c = await ofs.doc('config/contador').get();
      if (c.exists && (c.data().next || 1) > S.next) await withLock(refs.inv, () => refs.cnt.set({next: c.data().next}));
      hecho.push(`${f.docs.length} ventas y ${mv.docs.length} movimientos`);
    }
    toast(hecho.length ? 'Listo. Se trajeron: ' + hecho.join(', ') + '.' : 'El sistema anterior no tenía datos para traer.');
  } catch (e) {
    console.warn(e);
    toast(e && /auth\/(invalid|wrong|user-not-found)/.test(e.code || '') ? 'El correo o la contraseña del sistema anterior no son correctos.' : e && e.code === 'permission-denied' ? 'Firebase no permitió leer o guardar los datos.' : 'No se pudieron traer los datos. Revise el internet e intente de nuevo.');
  }
  try { await app2?.auth().signOut(); } catch {}
}

// Crea la cuenta en Firebase Authentication sin cerrar la sesión del dueño (usa una segunda conexión).
async function crearCuenta(email, pw) {
  const app2 = firebase.apps.find(a => a.name === 'altas') || firebase.initializeApp(fbConfig(), 'altas');
  const a2 = app2.auth();
  try { await a2.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch {}
  const cred = await a2.createUserWithEmailAndPassword(email, pw);
  const uid = cred.user.uid;
  try { await a2.signOut(); } catch {}
  return uid;
}

  cobrar: () => cobrar(),
  toTicket: () => $('#ticket')?.scrollIntoView({behavior: 'smooth', block: 'start'}),
  copyrc: t => { const f = S.facturas.find(x => x.numero === t.dataset.n) || (S.lastF && S.lastF.numero === t.dataset.n ? S.lastF : null); if (f) copyText(receiptText(f)); },
  close: () => { if (S.mres) S.mres(false); else closeModal(); },
  'm-ok': () => S.mres && S.mres(true),
  'm-cancel': () => S.mres ? S.mres(false) : closeModal(),
  'm-del': () => S.mres && S.mres('del'),
  pin: t => S.pinKey && S.pinKey(t.dataset.v),
  fest: t => { S.fest = t.dataset.v; renderFList(); },
  fsel: t => { S.fsel = t.dataset.n; renderFList(); renderFDet(); if (matchMedia('(max-width:760px)').matches) $('#fDet')?.scrollIntoView({behavior: 'smooth'}); },
  anular: t => anularFlow(t.dataset.n),
  anChip: t => { const a = $('#anMot'); a.value = t.dataset.v; document.querySelectorAll('#anChips button').forEach(b => b.setAttribute('aria-pressed', b === t)); },
  ifil: t => { S.ifil = t.dataset.v; renderInv(); },
  ingIn: t => invMove(t.dataset.id, 'entrada'),
  ingCount: t => invMove(t.dataset.id, 'conteo'),
  ingMerma: t => invMerma(t.dataset.id),
  mermaProd: () => mermaProducto(),
  mmChip: t => { const a = $('#mmN'); a.value = t.dataset.v; document.querySelectorAll('#mmChips button').forEach(b => b.setAttribute('aria-pressed', b === t)); },
  ingEdit: t => ingEdit(t.dataset.id),
  ingNew: () => ingEdit(null),
  mvAdd: t => { const i = $('#mvQ'); i.value = r3((parseFloat(i.value) || 0) + +t.dataset.v); },
  mcat: t => { S.mcat = t.dataset.v; renderMenu(); },
  pNew: () => S.mcat === 'promos' ? promoEdit(null, 'regalo') : pEdit(null),
  promoNew: t => promoEdit(null, t.dataset.v),
  promoEdit: t => promoEdit(t.dataset.id),
  promoToggle: t => promoToggle(t.dataset.id),
  pEdit: t => pEdit(t.dataset.id),
  pToggle: async t => {
    const id = t.dataset.id;
    try { await withLock(refs.menu, async () => { const s = await refs.menu.get(); const m = clone(s.data()); const p = m.productos.find(x => x.id === id); if (p) p.activo = p.activo === false; await refs.menu.set(m); }); }
    catch { toast('No se pudo cambiar el estado.'); }
  },
  pfCat: t => { if (!PD) return; const c = t.dataset.v; PD.cat = c; const nt = c === 'pizza' ? PIZZA_SIZES.slice() : ['U'];
    if (nt.join() !== PD.tamanos.join()) { const base = PD.receta.M || PD.receta.U || {}; const bp = PD.precios.M ?? PD.precios.U; PD.tamanos = nt; PD.receta = Object.fromEntries(nt.map(s => [s, {...base}])); PD.precios = Object.fromEntries(nt.map(s => [s, bp])); }
    pfRerender(); },
  pfQuitarFoto: () => { if (!PD) return; PD._foto = null; PD._quitar = true; pfRerender(); },
  pfIco: t => { if (!PD) return; PD.icon = t.dataset.v; if (!PD._foto && (PD._quitar || !S.fotos?.[PD.id])) { const pv = $('#pfPrev img'); if (pv && FOTOS[PD.icon]) pv.src = FOTOS[PD.icon]; } document.querySelectorAll('.icopick button').forEach(b => b.setAttribute('aria-pressed', b === t)); },
  pfAdd: () => { const rows = pRows(); const free = Object.keys(S.inv).find(k => !rows.includes(k)); if (free) { rows.push(free); pfRerender(); } },
  pfDel: t => { const rows = pRows(); const ing = rows[+t.dataset.v]; rows.splice(+t.dataset.v, 1); PD.tamanos.forEach(s => { if (PD.receta[s]) delete PD.receta[s][ing]; }); pfRerender(); },
  pfCalc: () => { const mult = S.neg.mult || NEG_DEF.mult; pRows().forEach(ing => { const base = +PD.receta.M?.[ing] || 0; if (!base || S.inv[ing]?.unidad === 'unidad') return; ['P', 'G', 'F'].forEach(s => { PD.receta[s] = PD.receta[s] || {}; PD.receta[s][ing] = Math.round(base * (+mult[s] || 1)); }); }); pfRerender(); toast('Cantidades calculadas. Revise las cajas y ajuste a su gusto.'); },
  rtab: t => { S.rep.tab = t.dataset.v; document.querySelectorAll('#rTabs button').forEach(b => b.setAttribute('aria-pressed', b === t)); renderRep(); },
  rper: t => { S.rep.per = t.dataset.v; document.querySelectorAll('#rPer button').forEach(b => b.setAttribute('aria-pressed', b === t)); $('#rRange').hidden = S.rep.per !== 'rango'; if (S.rep.per !== 'rango') loadRep(); },
  rload: () => { const f = $('#rFrom'), g = $('#rTo'); if (f) S.rep.from = f.value || S.rep.from; if (g) S.rep.to = g.value || S.rep.to; loadRep(); },
  rcsv: () => exportCSV(),
  ajSave: () => ajSave(),
  feRetry: t => feRetry(t.dataset.n, t.dataset.c),
  feCred: t => feGuardarCred(t.dataset.v),
  seed: () => seedDB(),
  promoAdd: t => promoAdd(t.dataset.id),
  descMenu: () => descMenu(),
  descQuitar: () => { S.desc = null; renderTicket(); },
  consumoToggle: () => { S.consumo = !S.consumo; if (S.consumo) S.desc = null; renderTicket(); },
  'm-pick': t => S.mres && S.mres(t.dataset.v),
  cajaMenu: () => cajaMenu(),
  puestoElegir: () => elegirPuesto(),
  puestoSet: t => puestoSet(t.dataset.v),
  cajaAbrir: () => cajaAbrir(),
  cajaMov: t => cajaMov(t.dataset.v),
  cajaArqueo: () => cajaArqueo(),
  cajaCerrar: () => cajaCerrar(),
  cierrePrt: () => { if (S.lastCierre) printDoc(cierreHTML(S.lastCierre), false); },
  turnoVer: t => verTurno(t.dataset.id),
  salir: () => firebase.auth().signOut().then(() => location.reload()),
  primerDueno: () => primerDueno(),
  meMenu: () => meMenu(),
  miClave: () => miClave(),
  sucGo: t => cambiarSucursal(t.dataset.id),
  sucNew: () => sucEdit(null),
  sucEdit: t => sucEdit(t.dataset.id),
  usrNew: () => usrEdit(null),
  importar: () => importarAnterior(),
  usrEdit: t => usrEdit(t.dataset.id),
  logout: async () => { if (await confirmBox('Cerrar sesión', 'Para volver a entrar necesitará el usuario y la contraseña.', 'Cerrar sesión')) firebase.auth().signOut(); },
  cfgSave: () => { const c = parseConfig($('#cfgT').value); if (!c) { $('#cfgE').textContent = 'No encontré apiKey y projectId en lo que pegó. Copie el bloque completo.'; return; } ls.set('fbconfig', c); location.reload(); },
  prt: t => { const f = findF(t.dataset.n); if (f) printDoc(receiptHTML(f), false); },
  prtk: t => { const f = findF(t.dataset.n); const k = f ? kitchenOf(f) : S.comandas.find(c => c.numero === t.dataset.n); if (k) printDoc(kitchenHTML(k), true); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('input', e => {
  const t = e.target, id = t.id;
  if (id === 'tkNit') { S.cliente.nit = t.value; const x = $('#tkDocT'); if (x) x.textContent = '· ' + (idTipo(S.cliente.nit) && correoOK(S.cliente.correo) ? 'se emitirá factura electrónica' : 'se emitirá tiquete electrónico'); }
  else if (id === 'tkNom') S.cliente.nombre = t.value;
  else if (id === 'tkPara') S.consumoPara = t.value;
  else if (id === 'tkMail') { S.cliente.correo = t.value; const x = $('#tkDocT'); if (x) x.textContent = '· ' + (idTipo(S.cliente.nit) && correoOK(S.cliente.correo) ? 'se emitirá factura electrónica' : 'se emitirá tiquete electrónico'); }
  else if (id === 'tkRec') { S.recibido = t.value.replace(',', '.'); updateTotals(); }
  else if (id === 'fQ') { S.fq = t.value; renderFList(); }
  else if (id === 'iQ') { S.iq = t.value; renderInv(); }
  else if (id === 'mvQ' && $('#mvDiff')) {
    const name = $('.sheet h2').textContent; const v = parseFloat(t.value);
    const ing = Object.values(S.inv).find(i => name.includes(i.nombre));
    $('#mvDiff').textContent = ing && v >= 0 ? `Diferencia contra el sistema: ${v - ing.stock >= 0 ? '+' : ''}${fmtQty(v - ing.stock, ing.unidad)}` : 'Escriba lo que contó en bodega; el sistema registra la diferencia.';
  }
  else if (PD && t.dataset.pf) PD[t.dataset.pf] = t.value;
  else if (PD && t.dataset.pfp) PD.precios[t.dataset.pfp] = parseFloat(t.value) || '';
  else if (PD && t.dataset.pfq) { const [ri, s] = t.dataset.pfq.split('|'); const ing = pRows()[+ri]; PD.receta[s] = PD.receta[s] || {}; PD.receta[s][ing] = parseFloat(t.value) || 0; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rSuc') { S.rep.suc = t.value; loadRep(); }
  else if (t.id === 'usR') { const w = $('#usSw'); if (w) w.hidden = t.value === 'dueno'; }
  else if (PD && t.dataset.pfi !== undefined) {
    const ri = +t.dataset.pfi; const rows = pRows(); const old = rows[ri]; const nw = t.value; rows[ri] = nw;
    PD.tamanos.forEach(s => { if (PD.receta[s] && old in PD.receta[s]) { PD.receta[s][nw] = PD.receta[s][old]; delete PD.receta[s][old]; } });
    pfRerender();
  }
  else if (t.id === 'pfFoto' && t.files[0] && PD) {
    reducirFoto(t.files[0]).then(url => { PD._foto = url; PD._quitar = false; pfRerender(); }).catch(() => toast('No se pudo leer esa imagen.'));
  }
  else if (t.id === 'igU') { const U = UNITS[t.value]; ['igUl1', 'igUl3'].forEach(k => { const x = $('#' + k); if (x) x.textContent = U.l; }); const y = $('#igUl2'); if (y) y.textContent = U.big; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) ACT['m-cancel'](); if (e.key === 'Enter' && e.target.id === 'tkRec') cobrar(); });

document.addEventListener('submit', async e => {
  if (e.target.id !== 'loginF') return; e.preventDefault();
  const us = $('#lgE').value.trim(), pw = $('#lgP').value; const b = $('#lgBtn'); b.disabled = true; b.textContent = 'Entrando…';
  try { ls.set('lastUser', us); await firebase.auth().signInWithEmailAndPassword(usuarioACorreo(us), pw); }
  catch (err) { $('#lgErr').textContent = AUTH_ERR[err.code] || 'No se pudo entrar (' + (err.code || 'error') + ').'; b.disabled = false; b.textContent = 'Entrar'; }
});
boot();
</script>
</body>
</html>
